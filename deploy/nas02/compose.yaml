services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: cli-api-proxy
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  cli-api-proxy:
    image: ${REGISTRY:-nas02.donkey-bushi.ts.net:5050}/cli-proxy-api
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      # Management API key; also keeps remote management enabled for the control panel.
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?MANAGEMENT_PASSWORD must be set}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
